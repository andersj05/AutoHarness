[package]
name = "autoharness-provider-codex-cli"
description = "Official Codex CLI adapter for AutoHarness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/andersj05/AutoHarness"
license = "MIT"
publish = false

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
autoharness-domain.workspace = true
autoharness-provider.workspace = true
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
