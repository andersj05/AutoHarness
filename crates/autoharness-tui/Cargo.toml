[package]
name = "autoharness-tui"
description = "Ratatui model-update-view client for AutoHarness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
benchmark-instrumentation = []

[dependencies]
autoharness-domain.workspace = true
autoharness-presentation.workspace = true
autoharness-settings.workspace = true
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["crossterm"] }
tokio = { version = "1.53.0", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
unicode-width = "0.2"
zeroize.workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"

[lints]
workspace = true
