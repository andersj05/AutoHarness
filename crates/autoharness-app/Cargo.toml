[package]
name = "autoharness-app"
description = "AutoHarness desktop application composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
default-run = "autoharness"

[lib]
name = "autoharness_app"
path = "src/lib.rs"

[[bin]]
name = "autoharness"
path = "src/main.rs"
required-features = ["gui"]


[[bin]]
name = "ah"
path = "src/ah.rs"
required-features = ["gui"]
test = false
bench = false
doc = false

[features]
default = ["gui-package"]
gui = ["dep:tauri", "dep:tauri-build"]
# Embed local production assets for source and installer launches.
gui-package = ["gui", "tauri/custom-protocol"]

[dependencies]
async-trait.workspace = true
autoharness-client.workspace = true
autoharness-domain.workspace = true
autoharness-engine.workspace = true
autoharness-memory.workspace = true
autoharness-provider.workspace = true
autoharness-provider-gemini.workspace = true
autoharness-provider-codex-cli.workspace = true
autoharness-provider-openai.workspace = true
autoharness-settings.workspace = true
autoharness-store.workspace = true
autoharness-store-sqlite.workspace = true
autoharness-tool.workspace = true
futures-util.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true , features = [] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2.11.5", optional = true , features = [] }

[dev-dependencies]
async-stream.workspace = true
async-trait.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize.workspace = true

[lints]
workspace = true
