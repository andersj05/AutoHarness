[package]
name = "autoharness-app"
description = "AutoHarness terminal application composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "autoharness_app"
path = "src/lib.rs"

[[bin]]
name = "autoharness"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
autoharness-domain.workspace = true
autoharness-engine.workspace = true
autoharness-provider.workspace = true
autoharness-provider-gemini.workspace = true
autoharness-provider-openai.workspace = true
autoharness-settings.workspace = true
autoharness-store.workspace = true
autoharness-store-sqlite.workspace = true
autoharness-tui.workspace = true
autoharness-tool.workspace = true
crossterm.workspace = true
futures-util.workspace = true
keyring.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true

[dev-dependencies]
async-stream.workspace = true
async-trait.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize.workspace = true

[lints]
workspace = true
