[package]
name = "autoharness-app"
description = "AutoHarness terminal application composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "autoharness_app"
path = "src/lib.rs"

[[bin]]
name = "autoharness"
path = "src/main.rs"


[[bin]]
name = "ah"
path = "src/ah.rs"

[features]
benchmark-instrumentation = ["autoharness-tui/benchmark-instrumentation"]

[dependencies]
async-trait.workspace = true
autoharness-domain.workspace = true
autoharness-engine.workspace = true
autoharness-memory.workspace = true
autoharness-provider.workspace = true
autoharness-provider-gemini.workspace = true
autoharness-provider-codex-cli.workspace = true
autoharness-provider-openai.workspace = true
autoharness-settings.workspace = true
autoharness-store.workspace = true
autoharness-store-sqlite.workspace = true
autoharness-tui.workspace = true
autoharness-tool.workspace = true
crossterm.workspace = true
futures-util.workspace = true
keyring.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true

[dev-dependencies]
async-stream.workspace = true
async-trait.workspace = true
portable-pty = "0.9.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vt100 = "0.15.2"
zeroize.workspace = true

[lints]
workspace = true
