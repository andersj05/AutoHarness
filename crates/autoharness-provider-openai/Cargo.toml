[package]
name = "autoharness-provider-openai"
description = "Configurable OpenAI-compatible model-router adapter for AutoHarness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
autoharness-domain.workspace = true
autoharness-provider.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio = { workspace = true, features = ["macros", "time"] }
zeroize.workspace = true

[dev-dependencies]
autoharness-provider = { path = "../autoharness-provider", features = ["conformance"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
