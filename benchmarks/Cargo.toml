[package]
name = "autoharness-phase1-benchmarks"
description = "Dependency-neutral Phase 1 performance benchmark runner for AutoHarness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
autoharness-domain = { path = "../crates/autoharness-domain" }
autoharness-engine = { path = "../crates/autoharness-engine" }
autoharness-store = { path = "../crates/autoharness-store" }
autoharness-store-sqlite = { path = "../crates/autoharness-store-sqlite" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
