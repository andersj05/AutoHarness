name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --no-deps -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Test documentation
        run: cargo test --workspace --doc --all-features --locked

  benchmarks:
    name: Validate benchmark environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Check benchmark formatting
        run: cargo fmt --manifest-path benchmarks/Cargo.toml -- --check
      - name: Run benchmark Clippy
        run: cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets --locked --no-deps -- -D warnings
      - name: Test benchmark environment
        run: cargo test --manifest-path benchmarks/Cargo.toml --all-targets --locked

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2025
          - name: macOS arm64
            os: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --no-fail-fast
