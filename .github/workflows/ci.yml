name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Show toolchain
        run: rustc --version --verbose
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libayatana-appindicator3-dev
          libdbus-1-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check generated desktop themes
        run: cargo run -p autoharness-presentation --bin generate_gui_themes --locked -- --check
      - name: Run renderer-neutral Clippy
        run: >-
          cargo clippy --workspace
          --exclude autoharness-app
          --exclude autoharness-tui
          --all-targets --all-features --locked --no-deps -- -D warnings
      - name: Run desktop host Clippy
        run: >-
          cargo clippy -p autoharness-app
          --lib --bin autoharness
          --test credential_resolver
          --test profile_store
          --test secret_sentinel
          --test startup_reconnect
          --test vault_fake
          --features gui --locked --no-deps -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --exclude autoharness-tui --all-features --no-deps --locked
      - name: Test documentation
        run: cargo test --workspace --exclude autoharness-tui --doc --all-features --locked

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check relative documentation links
        run: python3 scripts/check_docs_links.py

  frontend:
    name: Desktop GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        run: pnpm gui:typecheck
      - name: Test frontend
        run: pnpm gui:test
      - name: Build frontend
        run: pnpm gui:build

  benchmarks:
    name: Validate storage benchmark environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Check benchmark formatting
        run: cargo fmt --manifest-path benchmarks/Cargo.toml -- --check
      - name: Run benchmark Clippy
        run: cargo clippy --manifest-path benchmarks/Cargo.toml --bin autoharness-phase1-benchmarks --locked --no-deps -- -D warnings
      - name: Test benchmark environment
        run: cargo test --manifest-path benchmarks/Cargo.toml --bin autoharness-phase1-benchmarks --locked

  test:
    name: Runtime and desktop tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2025
          - name: macOS arm64
            os: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Install Linux desktop system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libayatana-appindicator3-dev
          libdbus-1-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
          libxdo-dev
          pkg-config
      - name: Run renderer-neutral tests
        run: >-
          cargo test --workspace
          --exclude autoharness-app
          --exclude autoharness-tui
          --all-targets --all-features --locked --no-fail-fast
      - name: Run desktop host tests
        run: >-
          cargo test -p autoharness-app
          --lib --bin autoharness
          --test credential_resolver
          --test profile_store
          --test secret_sentinel
          --test startup_reconnect
          --test vault_fake
          --features gui --locked --no-fail-fast
