name: GUI candidate packages

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package and native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Linux system webview and test driver
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev libssl-dev
          libwebkit2gtk-4.1-dev libxdo-dev pkg-config webkit2gtk-driver xvfb
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Validate release tooling
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build unsigned candidate (never promotion evidence)
        run: python scripts/package_gui.py --unsigned
      - name: Install pinned native test carrier
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.0.6 --locked --root target/gui-tools
      - name: Match Microsoft native driver to WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_gui_webdriver.ps1
      - name: Windows installer and native lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          ./scripts/test_gui_installer.ps1 -Installer $installers[0].FullName
      - name: Linux install and native lifecycle
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' python scripts/gui_webdriver.py --binary /usr/bin/autoharness --driver target/gui-tools/bin/tauri-driver --native-driver /usr/bin/WebKitWebDriver --output target/gui-evidence/linux
      - name: Linux uninstall
        if: always() && runner.os == 'Linux'
        run: sudo dpkg --remove autoharness || test ! -e /usr/bin/autoharness
      - name: macOS package structure
        if: runner.os == 'macOS'
        run: |
          test -x target/release/bundle/macos/AutoHarness.app/Contents/MacOS/autoharness
          plutil -lint target/release/bundle/macos/AutoHarness.app/Contents/Info.plist
      - name: Retain packages and synthetic screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-candidate-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/gui-packages/
            target/gui-evidence/
          if-no-files-found: error
          retention-days: 14
