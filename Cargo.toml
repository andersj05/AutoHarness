[workspace]
members = [
    "crates/autoharness-client",
    "crates/autoharness-domain",
    "crates/autoharness-engine",
    "crates/autoharness-memory",
    "crates/autoharness-app",
    "crates/autoharness-provider",
    "crates/autoharness-provider-gemini",
    "crates/autoharness-provider-codex-cli",
    "crates/autoharness-provider-openai",
    "crates/autoharness-settings",
    "crates/autoharness-store",
    "crates/autoharness-store-sqlite",
    "crates/autoharness-tui",
    "crates/autoharness-tool",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/andersj05/AutoHarness"
license = "MIT"
publish = false

[workspace.dependencies]
autoharness-client = { path = "crates/autoharness-client" }
autoharness-domain = { path = "crates/autoharness-domain" }
autoharness-engine = { path = "crates/autoharness-engine" }
autoharness-memory = { path = "crates/autoharness-memory" }
autoharness-provider = { path = "crates/autoharness-provider" }
autoharness-provider-gemini = { path = "crates/autoharness-provider-gemini" }
autoharness-provider-openai = { path = "crates/autoharness-provider-openai" }
autoharness-settings = { path = "crates/autoharness-settings" }
autoharness-provider-codex-cli = { path = "crates/autoharness-provider-codex-cli" }
autoharness-store = { path = "crates/autoharness-store" }
autoharness-store-sqlite = { path = "crates/autoharness-store-sqlite" }
autoharness-tui = { path = "crates/autoharness-tui" }
autoharness-tool = { path = "crates/autoharness-tool" }
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
crossterm = "0.29"
futures-core = "0.3"
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
uuid = "1"
url = "2"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
