[workspace]
members = [
    "crates/autoharness-domain",
    "crates/autoharness-engine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/andersj05/AutoHarness"
publish = false

[workspace.dependencies]
autoharness-domain = { path = "crates/autoharness-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
